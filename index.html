<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maps</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>

    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

</head>
<style>

    #locations{
        width: 250px;
    }
    .location{
        padding: 10px;
        border-bottom: 1px solid #ddd;
        cursor:pointer;
    }
    .location:hover{
        background: #eee;
    }
    .container{
        display:flex;
        gap: 15px;
    }
    #map {
        height: 500px;
        flex: 1;
    }
    .popup-image{
        max-width: 200px;
        height: auto;
        object-fit: fill;
    }
</style>
<body>
    <h1>Simple Map</h1>

    <h3>Locations</h3>

    <div class="container">
        <div id="locations">
            <div id="location-list"></div>
        </div>

        <div id="map"></div>
    </div>

</body>
<script>

    function initMap(mapDataUrl) {
        const map = L.map('map').setView([8.360,124.868], 17);

        const openstreetMap = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom:19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        });

        const satellite = L.tileLayer(
            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            {attribution: 'Tiles (c) Esri -, Maxar, Earthstar, Geogrphics, & GIS User Community'}
        );

        satellite.addTo(map);

        //render pins
        fetch(mapDataUrl)
        .then(response=>response.json())
        .then(data=>{

            data.forEach(pin=>{
                const marker = L.marker([pin.lat, pin.long]).addTo(map);

                const image = `<img src='${pin.img}' class="popup-image">`;

                marker.bindPopup(`
                    ${pin.title}<br>
                    <hr>
                    ${image}
                `);

                const item = document.createElement('div');
                item.className = 'location';
                item.textContent = pin.title;

                document.getElementById('location-list').appendChild(item);

                item.onclick = () =>{
                    map.flyTo([pin.lat,pin.long],18);
                    marker.openPopup();
                }
            });

            const baseMaps = {
                "OpenStreetMap" : openstreetMap,
                "Satellite" : satellite
            };

            L.control.layers(baseMaps).addTo(map);

        });
    }

    initMap('campus-map.json');

</script>
</html>
