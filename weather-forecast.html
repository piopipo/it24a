
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
</head>
<body>

    <h1>Weather Forecast Application</h1>

    <h2>Select Location</h2>

    <button onclick="getGPSLocation()">Use My GPS</button>
    <button onclick="getWeather()">Manual Location</button>

    <p id="locationResult"></p>

    <hr>

    <div id="weatherResult"></div>

    <div id="forecastResult"></div>


    <script>

        const apiKey = "YOUR_OPENWEATHER_API_KEY";


        // MANUAL LOCATION
        async function getWeather() {

            const city = prompt("Enter a city name");

            if (!city) {
                alert("No city entered");
                return;
            }

            const url =
                `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

            try {

                const response = await fetch(url);

                if (!response.ok) {
                    throw new Error("City not found");
                }

                const data = await response.json();

                getWeatherByCoordinates(
                    data.coord.lat,
                    data.coord.lon
                );

            } catch (error) {

                alert("Error: " + error.message);

            }
        }


       function getGPSLocation() {

    if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
    }

    document.getElementById("locationResult").innerHTML =
        "Getting your location...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            getWeatherByCoordinates(latitude, longitude);

        },

        function(error) {

            document.getElementById("locationResult").innerHTML = "";

            alert("GPS Error: " + error.message);

        }

    );
}


        // GET WEATHER USING COORDINATES
        async function getWeatherByCoordinates(lat, lon) {

            const weatherURL =
                `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;

            const forecastURL =
                `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`;

            try {

                const weatherResponse = await fetch(weatherURL);
                const forecastResponse = await fetch(forecastURL);

                if (!weatherResponse.ok || !forecastResponse.ok) {
                    throw new Error("Unable to retrieve weather data.");
                }

                const weatherData = await weatherResponse.json();
                const forecastData = await forecastResponse.json();


                // DISPLAY LOCATION
                document.getElementById("locationResult").innerHTML =
                    "Location: " + weatherData.name;


                // DISPLAY CURRENT WEATHER
                document.getElementById("weatherResult").innerHTML = `

                    <h2>Current Weather</h2>

                    <p>City: ${weatherData.name}</p>

                    <p>Temperature: ${weatherData.main.temp} °C</p>

                    <p>Weather: ${weatherData.weather[0].description}</p>

                    <p>Humidity: ${weatherData.main.humidity}%</p>

                    <p>Wind Speed: ${weatherData.wind.speed} m/s</p>

                `;


                // DISPLAY FORECAST
                document.getElementById("forecastResult").innerHTML =
                    "<h2>5-Day Weather Forecast</h2>";

                forecastData.list.forEach((forecast, index) => {

                    // Display every 8th entry (approximately every 24 hours)
                    if (index % 8 === 0) {

                        document.getElementById("forecastResult").innerHTML += `

                            <div>

                                <h3>${forecast.dt_txt}</h3>

                                <p>Temperature: ${forecast.main.temp} °C</p>

                                <p>Weather: ${forecast.weather[0].description}</p>

                                <p>Humidity: ${forecast.main.humidity}%</p>

                            </div>

                            <hr>

                        `;

                    }

                });


            } catch (error) {

                alert("Error: " + error.message);

            }

        }

    </script>

</body>
</html>
