<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Todo List</h1>
    <input
        type="text"
        id="taskInput"
        placeholder="Add a Task"
/>
    <button onclick="addTask()">Add Task</button>
    <ul id="taskList">Your task goes here ...</ul>

<script>
function getTaskTest() {
    const input = document.getElementById("taskInput");
    const text = input.value.trim();

    console.log("The input value is: " + input.value);
    return text;
}

function addTask() {
    const taskTest = getTaskTest();
    addTaskItem(taskTest);
}

function addTaskItem(taskText){
    const li = document.createElement('li');
    const taskSpan = document.createElement('span');
    taskSpan.textContent = taskText;
    li.appendChild(taskSpan);

    document.getElementById('taskList').appendChild(li);

    // Call createdDoneButton() function
    const doneBtn = createDoneButton(li);
    li.appendChild(doneBtn);

    // Call createEditButton() function
    const editBtn = createEditButton(li);
    li.appendChild(editBtn);

    // Call createDeleteButton() function
    const deleteBtn = createDeleteButton(li);
    li.appendChild(deleteBtn);
}
function createDoneButton(li){
    const doneBtn = document.createElement("Button");
    doneBtn.textContent = "Done"
    doneBtn.style.marginLeft="8px";

    doneBtn.onclick = () => {
        console.log(li);
        li.classList.add("Done");
        const button = li.querySelectorAll("Button");

        button.forEach(btn =>{
            btn.disabled = true;
    });

        console.log("Task  Completed", li);
    }
    return doneBtn;
}

function createEditButton(li, taskSpan){
    const editBtn = document.createElement("Button");
    editBtn.textContent = "Edit";
    editBtn.style.marginLeft = "8px";
    editBtn.onclick = () => handleEditClick(li);
    return editBtn;
}
function handleEditClick(li){
    const currentText = li.firstChild.textContent.trim();
    const newText = prompt("Edit your Task, currentText");

    if(newText !=null && newText.trim() !==""){
        li.firstChild.textContent = newText.trim();
        alert("Updated Task");
    }else{
        alert("No changes Made");
    }
 }
function createDeleteButton(li){
    const deleteBtn = document.createElement("Button");
    deleteBtn.textContent = "Delete";
    deleteBtn.style.marginLeft = "8px";
    deleteBtn.onclick = () => handleDeleteClick(li);
    return deleteBtn;
}

function handleDeleteClick(li){
    li.remove();
    alert("Task Deleted");
}
</script>

</body>
</html>
